version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiwx-postgres
    environment:
      POSTGRES_DB: aiwx
      POSTGRES_USER: aiwx
      POSTGRES_PASSWORD: aiwx
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/0001_init.up.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiwx"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: aiwx-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "nats-server", "--signal", "ldm", "pidfile"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
