version: "2"

run:
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - hugeParam
        - rangeValCopy
        - unnamedResult
        - paramTypeCombine
        - nestingReduce
        - exitAfterDefer
        - filepathJoin
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/rverhe/aiwx

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
